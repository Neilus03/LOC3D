[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delimit3d"
version = "0.3.0"
description = "Contrastive 3D pretraining from SAM2 and UnSAMv2 2D masks"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.4,<2.6",
  "PyYAML>=6.0",
  "Pillow>=9.0",
  "opencv-python>=4.8",
  "imageio>=2.20",
  "plyfile>=0.8",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

dev = ["pytest>=9.0"]
sources = ["open3d==0.19.0"]

[project.scripts]
delimit3d-prepare = "delimit3d.data.cli:main"
delimit3d-pretrain = "delimit3d.pretraining.cli:main"
delimit3d-train = "delimit3d.tasks.cli:train_main"
delimit3d-evaluate = "delimit3d.tasks.cli:evaluate_main"
delimit3d-probe = "delimit3d.probes.cli:main"
delimit3d-export = "delimit3d.pretraining.export:main"
delimit3d-calibrate-bn = "delimit3d.cli.recalibrate_bn:main"
delimit3d-infer = "delimit3d.inference.cli:main"
delimit3d-demo = "delimit3d.inference.cli:demo_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE.md", "THIRD_PARTY_NOTICES.md", "third_party/*.LICENSE"]

[tool.setuptools.package-data]
"delimit3d.runtime" = ["assets/*.json", "assets/*.patch", "assets/*.list"]
"delimit3d.inference" = ["static/*.html", "static/*.css", "static/*.mjs"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
