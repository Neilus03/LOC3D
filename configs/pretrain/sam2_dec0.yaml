extends: base.yaml
name: sam2_dec0_150ep
description: Scratch LitePT-S* pretraining with SAM2 masks and native dec0 contrastive loss.
reference: ../reproduce/sam2_pf69_2gpu_original.json
grid_size: 0.02
required_crop_mode: full_scene
train_augmentation_profile: mask3d_scannet_rgbn6_fullscene_v1
epochs: 150
backbone_lr: 0.0001
grad_clip_norm: 5
source_granularity: sam2
allow_shared_proposal_negatives: false
sampling_mode: coverage_multigranular_v2
multiscale_supervision: false
multiscale_loss_weight: 0
hierarchy_supervision: 'off'
hierarchy_mask_loss_weight: 0
hierarchy_vicreg_loss_weight: 0
normalization_policy: sync_batchnorm
bn_recalibration_scenes: 48
rank_balance_policy: rotating_local_padding_v1
flush_logical_batch_at_eval: true
source_loading_mode: logical_batch
source_loader_workers: 1
fixed_eval_pack: ${DELIMIT3D_FIXED_EVAL}
source_audit: ${DELIMIT3D_SOURCE_AUDIT}
code_manifest: ${DELIMIT3D_CODE_MANIFEST}
evaluation_epochs: 0,25,50,75,100,125,150
checkpoint_epochs: 0,25,50,75,100,125,150
