# Saved predictions only. No decoder replay or inference. Use a fresh output directory.
# CPU: python scripts/visualization/run_suite.py --config THIS.yaml --output NEW --formats html png pdf
version: 1
seed: 42
max_display_points: 20000
max_analysis_points: 12000
visualizations: [rgb, labels, prediction, clicks]
scenes:
  - scene_id: scene0568_00
    dataset: ScanNet
    kind: ply
    path: /path/to/original/scene0568_00.ply
    fields:
      points: [x, y, z]
      colors: [R, G, B]
      labels: label
    metadata:
      background_ids: [0]
      experiment_family: public_vs_256_update_adaptation
    queries: []
models:
  - kind: agile3d_episode
    name: LitePT + corresponding trained AGILE3D decoder
    path: /path/to/saved_episode/record.json
