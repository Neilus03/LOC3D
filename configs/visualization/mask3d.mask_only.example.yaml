# Save all proposals before overlap resolution and record benchmark postprocessing
# (thresholds, scores, DBSCAN/NMS/top-k settings, mask expansion, ignored labels).
# Rendering uses separate visualization-only overlap resolution; diagnostics are not AP.
# Compatible class-aware exports declare output_contract: class_aware and may retain
# class_logits/class_probabilities/class_ids arrays. Scores are not uncertainty.
