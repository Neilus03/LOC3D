# Native Delimit3D mask-only output: no class head or class probabilities required.
# CPU: python scripts/visualization/run_suite.py --config THIS.yaml --output NEW --formats html png pdf
version: 1
seed: 42
max_display_points: 20000
max_analysis_points: 12000
visualizations: [rgb, labels, prediction, confidence]
scenes:
  - scene_id: scene0568_00
    dataset: ScanNet
    kind: npz
    path: /path/to/original_scene.npz
    metadata:
      background_ids: [0]
      experiment_family: scratch_vs_pretrained_5cm
    queries: []
models:
  - kind: mask3d_proposals
    name: LitePT + mask-only Mask3D (exact checkpoint)
    path: /path/to/saved_proposals/record.json
# Future evaluator export (arrays are already evaluated outputs; no inference here):
